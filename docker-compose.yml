services:
  db:
    image: postgres:16-alpine
    container_name: presentation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pres
      POSTGRES_PASSWORD: pres_secret
      POSTGRES_DB: presentation_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pres -d presentation_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
